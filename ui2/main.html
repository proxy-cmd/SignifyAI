<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signify AI Dashboard</title>
  <link rel="stylesheet" href="style2.css" />
</head>
<body>
  <div class="dashboard">
    <header class="dashboard-header">
      <div>
        <h1>SignifyAI</h1>
        <p>Real-time gesture recognition | AI inference streaming</p>
      </div>
      <button id="backBtn" class="ghost-btn">Back to Landing</button>
    </header>

    <div class="dashboard-grid">
      <aside class="panel card">
        <h2>Session Control</h2>
        <button id="startSession" class="action-btn blue">Start Session</button>
        <button id="stopSession" class="action-btn red">Stop Session</button>
        <button id="toggleVoice" class="action-btn violet">Toggle Voice</button>
      </aside>

      <main class="camera-panel card">
        <h2>Camera Feed</h2>
        <div class="camera-box" id="cameraBox">Camera Feed</div>
      </main>

      <aside class="status-panel">
        <section class="card">
          <h2>Status</h2>
          <p>Hand detected: <strong id="handStatus">No</strong></p>
          <p>Latency: <strong id="latency">0 ms</strong></p>
        </section>

        <section class="card">
          <h2>System Info</h2>
          <p>Real-time gesture recognition</p>
          <p>AI inference streaming</p>
        </section>
      </aside>
    </div>

    <section class="intent-panel card">
      <h2>Detected Intent</h2>
      <p id="detectedIntent">Waiting...</p>
    </section>
  </div>

  <script>
    document.getElementById("backBtn").addEventListener("click", () => {
      window.location.href = "index2.html";
    });

    document.getElementById("startSession").addEventListener("click", () => {
      document.getElementById("detectedIntent").innerText = "Scanning active...";
      document.getElementById("handStatus").innerText = "Yes";
      document.getElementById("latency").innerText = "24 ms";
    });

    document.getElementById("stopSession").addEventListener("click", () => {
      document.getElementById("detectedIntent").innerText = "Session stopped";
      document.getElementById("handStatus").innerText = "No";
      document.getElementById("latency").innerText = "0 ms";
    });

    document.getElementById("toggleVoice").addEventListener("click", () => {
      const intent = document.getElementById("detectedIntent");
      intent.innerText = intent.innerText.includes("Mute") ? "Listening..." : "Mute voice mode";
    });
  </script>
</body>
</html>
